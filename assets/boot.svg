<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 609.5" width="820" height="609.5" font-family="'JetBrains Mono','Fira Mono','Courier New',monospace" role="img" aria-label="Terminal fsociety: boot sequence, whoami returns Guilherme Belinelo full-stack developer, then an ASCII fsociety mask is rendered line by line">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#064E3B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="maskfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="1.5" y="47" width="817" height="561.0"/></clipPath>
    <style>
      .win{fill:#0D1117} .bar{fill:#161B22}
      .prompt{fill:#22C55E;font-weight:700} .dim{fill:#6E7681} .txt{fill:#C9D1D9}
      .ok{fill:#22C55E;font-weight:700} .warn{fill:#EAB308} .name{fill:#22C55E;font-weight:700}
      .arrow{fill:#22C55E} .title{fill:#8B949E}
      .line{clip-path:inset(0 100% 0 0);animation:type .5s steps(30,end) forwards}
      .mrow{clip-path:inset(0 100% 0 0);animation:type .38s steps(30,end) forwards}
      @keyframes type{to{clip-path:inset(0 0 0 0)}}
      .l1{animation-delay:0.25s} .l2{animation-delay:0.7s} .l3{animation-delay:1.15s}
      .l4{animation-delay:1.55s} .l5{animation-delay:2.0s}
.mk1{animation-delay:2.400s}
.mk2{animation-delay:2.470s}
.mk3{animation-delay:2.540s}
.mk4{animation-delay:2.610s}
.mk5{animation-delay:2.680s}
.mk6{animation-delay:2.750s}
.mk7{animation-delay:2.820s}
.mk8{animation-delay:2.890s}
.mk9{animation-delay:2.960s}
.mk10{animation-delay:3.030s}
.mk11{animation-delay:3.100s}
.mk12{animation-delay:3.170s}
.mk13{animation-delay:3.240s}
.mk14{animation-delay:3.310s}
.mk15{animation-delay:3.380s}
.mk16{animation-delay:3.450s}
.mk17{animation-delay:3.520s}
.mk18{animation-delay:3.590s}
.mk19{animation-delay:3.660s}
.mk20{animation-delay:3.730s}
.mk21{animation-delay:3.800s}
.mk22{animation-delay:3.870s}
      .lf{animation-delay:4.12s}
      .cursor{opacity:0;animation:blink 1.05s steps(1,end) infinite;animation-delay:4.52s}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .scan{opacity:.06;animation:sweep 6s linear infinite}
      @keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(609.5px)}}
      @media (prefers-reduced-motion: reduce){
        .line,.mrow{clip-path:none !important;animation:none !important}
        .cursor{opacity:1 !important;animation:none !important} .scan{display:none}
      }
    </style>
  </defs>

