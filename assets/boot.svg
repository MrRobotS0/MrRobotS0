  <g font-size="16.5" filter="url(#glow)">
    <g class="line lf"><text x="30" y="579.5"><tspan class="prompt">guilherme@fsociety</tspan><tspan class="dim">:~$</tspan><tspan class="txt"> </tspan></text></g>
