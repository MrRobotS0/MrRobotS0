    <text class="mrow mk10" x="260.0" y="363.5" xml:space="preserve"> ░▓███████▓▓▓▓▓▓▓██████▓▓▓▓▓▓▓███████▓░</text>
    <text class="mrow mk11" x="260.0" y="379.0" xml:space="preserve">  ░██████████████████████████████████░</text>
